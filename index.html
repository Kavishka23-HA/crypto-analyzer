<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="xtttowHOr_ogoG4Qo8ozArR_wI0g7n51zMJ-8qbQbUE" />
  <meta name="description" content="Cyber-Hacker Dynamic Fast Auto-Refresh ExpertOption & Multi-Asset Signal Terminal.">
  <meta name="keywords" content="expert option signals, fast auto refresh signals, binary option 5s 15s 30s 60s, tradingview chart">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-PULSE // FAST AUTO-REFRESH TERMINAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #020408;
      --card-bg: rgba(5, 12, 8, 0.88);
      --card-border: rgba(0, 255, 102, 0.25);
      --matrix-green: #00ff66;
      --matrix-green-glow: rgba(0, 255, 102, 0.4);
      --gold-color: #ffd700;
      --gold-glow: rgba(255, 215, 0, 0.4);
      --expert-color: #00e5ff;
      --expert-glow: rgba(0, 229, 255, 0.4);
      --red-sell: #ff0055;
      --red-glow: rgba(255, 0, 85, 0.4);
      --text-main: #00ff66;
      --text-muted: #4e8060;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Fira Code', monospace;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    #matrix-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      opacity: 0.12;
      pointer-events: none;
    }

    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 10;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
    }

    .ticker-container {
      position: relative; z-index: 2;
      width: 100%; background: rgba(2, 6, 4, 0.95);
      border-bottom: 1px solid var(--card-border);
    }

    header {
      position: relative; z-index: 2;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 32px;
      background: rgba(3, 8, 5, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
    }

    .brand-logo {
      display: flex; align-items: center; gap: 12px;
      font-weight: 700; font-size: 18px;
      color: var(--matrix-green);
      text-shadow: 0 0 10px var(--matrix-green-glow);
    }

    .brand-logo .logo-icon {
      width: 32px; height: 32px;
      border: 1px solid var(--matrix-green);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 12px var(--matrix-green-glow);
      animation: pulse 2s infinite;
    }

    .asset-tab-group {
      display: flex; gap: 8px; flex-wrap: wrap;
    }

    .tab-btn {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 14px; border-radius: 4px;
      font-family: 'Fira Code', monospace;
      font-size: 11px; font-weight: 700;
      cursor: pointer; transition: all 0.3s;
    }

    .tab-btn:hover { border-color: var(--matrix-green); color: #fff; }
    .tab-btn.active-tab {
      background: var(--matrix-green); color: #000;
      box-shadow: 0 0 12px var(--matrix-green-glow);
    }
    .tab-btn.gold-tab.active-tab {
      background: var(--gold-color); color: #000;
      box-shadow: 0 0 15px var(--gold-glow);
    }
    .tab-btn.expert-tab.active-tab {
      background: var(--expert-color); color: #000;
      box-shadow: 0 0 15px var(--expert-glow);
    }

    @keyframes pulse { 0% { box-shadow: 0 0 5px var(--matrix-green); } 50% { box-shadow: 0 0 20px var(--matrix-green); } 100% { box-shadow: 0 0 5px var(--matrix-green); } }

    .dashboard-container {
      position: relative; z-index: 2;
      display: grid; grid-template-columns: 2.8fr 1.2fr;
      gap: 20px; padding: 20px;
      max-width: 1800px; margin: 0 auto;
      width: 100%; flex: 1;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      backdrop-filter: blur(16px);
      overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }

    .chart-section { height: 780px; }
    .signal-section { height: 780px; }

    .section-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px;
      background: rgba(0, 255, 102, 0.02);
    }

    .section-title {
      font-size: 13px; font-weight: 600;
      color: var(--matrix-green);
      text-transform: uppercase; letter-spacing: 1px;
    }

    .coin-selector-group {
      display: flex; gap: 6px;
      overflow-x: auto; max-width: 100%;
      padding-bottom: 4px;
    }
    .coin-selector-group::-webkit-scrollbar { height: 3px; }
    .coin-selector-group::-webkit-scrollbar-thumb { background: var(--card-border); }

    .coin-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px; border-radius: 4px;
      font-family: 'Fira Code', monospace;
      font-size: 11px; cursor: pointer; transition: all 0.2s;
      white-space: nowrap;
    }
    .coin-btn:hover, .coin-btn.active {
      background: var(--matrix-green); color: #000;
      font-weight: 700; box-shadow: 0 0 10px var(--matrix-green-glow);
    }

    .search-box { padding: 10px 14px; border-bottom: 1px solid var(--card-border); }
    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--card-border);
      padding: 8px 12px; border-radius: 4px;
      color: var(--matrix-green);
      font-family: 'Fira Code', monospace;
      font-size: 12px; outline: none;
    }

    .signal-scroll-area {
      padding: 14px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
      flex: 1;
    }
    .signal-scroll-area::-webkit-scrollbar { width: 4px; }
    .signal-scroll-area::-webkit-scrollbar-thumb { background: var(--card-border); }

    .sig-card {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 6px; padding: 12px;
      transition: all 0.2s ease; cursor: pointer;
      position: relative;
    }
    .sig-card:hover {
      border-color: var(--matrix-green);
      box-shadow: 0 0 12px var(--matrix-green-glow);
      transform: translateX(3px);
    }
    .sig-card.gold-card { border-color: var(--gold-color); }
    .sig-card.expert-card { border-color: var(--expert-color); }
    .sig-card.active-card {
      border-color: var(--matrix-green);
      background: rgba(0, 255, 102, 0.08);
      box-shadow: inset 0 0 10px var(--matrix-green-glow);
    }

    .sig-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .sig-pair { font-weight: 700; font-size: 14px; color: #fff; }

    .sig-tag { padding: 3px 8px; border-radius: 3px; font-size: 10px; font-weight: 700; }
    .sig-tag-buy {
      background: rgba(0, 255, 102, 0.15); color: var(--matrix-green);
      border: 1px solid var(--matrix-green); box-shadow: 0 0 8px var(--matrix-green-glow);
    }
    .sig-tag-sell {
      background: rgba(255, 0, 85, 0.15); color: var(--red-sell);
      border: 1px solid var(--red-sell); box-shadow: 0 0 8px var(--red-glow);
    }
    .sig-tag-expert {
      background: rgba(0, 229, 255, 0.15); color: var(--expert-color);
      border: 1px solid var(--expert-color); box-shadow: 0 0 8px var(--expert-glow);
    }

    .sig-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 6px; text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px; border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.03);
    }
    .sig-val { font-size: 12px; font-weight: 600; margin-top: 2px; }
    .sig-lbl { font-size: 9px; color: var(--text-muted); text-transform: uppercase; }

    .signal-timer-badge {
      font-size: 10px; color: #00e5ff;
      background: rgba(0, 229, 255, 0.1);
      padding: 2px 6px; border-radius: 3px;
      border: 1px solid rgba(0, 229, 255, 0.3);
      font-weight: 700;
    }

    .load-more-btn {
      background: rgba(0, 255, 102, 0.1);
      border: 1px solid var(--matrix-green);
      color: var(--matrix-green);
      padding: 10px; text-align: center;
      font-family: 'Fira Code', monospace;
      font-size: 11px; font-weight: 700;
      cursor: pointer; border-radius: 4px;
      transition: 0.3s; width: 100%;
    }
    .load-more-btn:hover {
      background: var(--matrix-green); color: #000;
      box-shadow: 0 0 15px var(--matrix-green-glow);
    }

    .terminal-logs {
      position: relative; z-index: 2;
      margin: 0 20px 20px 20px;
      background: rgba(0, 5, 2, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 6px; padding: 10px 16px;
      font-size: 11px; color: var(--matrix-green);
      height: 60px; overflow-y: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .log-line { opacity: 0.8; margin-bottom: 2px; }

    @media (max-width: 1200px) {
      .dashboard-container { grid-template-columns: 1fr; }
      .chart-section { height: 500px; }
      .signal-section { height: 550px; }
      header { flex-direction: column; gap: 10px; }
    }
  </style>
</head>
<body>

  <!-- Matrix Canvas Background -->
  <canvas id="matrix-canvas"></canvas>

  <!-- Live Ticker Tape -->
  <div class="ticker-container">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "proName": "OANDA:EURUSD", "title": "EUR/USD" },
          { "proName": "OANDA:XAUUSD", "title": "GOLD" },
          { "proName": "BINANCE:BTCUSDT", "title": "BITCOIN" },
          { "proName": "FX_IDC:GBPUSD", "title": "GBP/USD" }
        ],
        "colorTheme": "dark", "isTransparent": true, "displayMode": "adaptive", "locale": "en"
      }
      </script>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="brand-logo">
      <div class="logo-icon">&gt;_</div>
      <span>CYBER-PULSE // MULTI-ASSET AI TERMINAL</span>
    </div>

    <!-- Category Tabs -->
    <div class="asset-tab-group">
      <button class="tab-btn active-tab" id="tab-crypto" onclick="switchCategory('CRYPTO')">⚡ TOP 100 CRYPTO</button>
      <button class="tab-btn gold-tab" id="tab-xm" onclick="switchCategory('XM')">🥇 XM / FOREX METALS</button>
      <button class="tab-btn expert-tab" id="tab-expert" onclick="switchCategory('EXPERT')">🎯 EXPERT OPTION (AUTO REFRESH)</button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="dashboard-container">
    
    <!-- Chart Box -->
    <div class="glass-card chart-section">
      <div class="section-header">
        <div class="section-title">&gt; CHART: <span id="current-symbol-title" style="color:#fff;">BTC/USDT</span></div>
        <div class="coin-selector-group" id="coin-buttons-container"></div>
      </div>
      <div style="flex: 1; width: 100%; height: 100%;">
        <div id="tv_chart_container" style="height:100%; width:100%"></div>
      </div>
    </div>

    <!-- Signals Section -->
    <div class="glass-card signal-section">
      <div class="section-header">
        <div class="section-title" id="signals-header-title">&gt; NEURAL SIGNALS (CRYPTO 100)</div>
      </div>

      <div class="search-box">
        <input type="text" id="coinSearch" class="search-input" placeholder="root@matrix:~# search_asset..." onkeyup="filterCoins()">
      </div>

      <div class="signal-scroll-area" id="signals-container"></div>
      <div style="padding: 10px;" id="load-more-wrapper">
        <button class="load-more-btn" id="loadMoreBtn" onclick="renderMoreCoins()">[+] LOAD MORE COINS</button>
      </div>
    </div>

  </div>

  <!-- Terminal Logs -->
  <div class="terminal-logs" id="terminal-logs">
    <div class="log-line">[SYS_INIT] Auto-Refresh Engine Initialized...</div>
  </div>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script>
    // Matrix Background Animation
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '0123456789ABCDEF%&*/<>#@$';
    const drops = Array(Math.floor(canvas.width / 12)).fill(1);
    function drawMatrix() {
      ctx.fillStyle = 'rgba(2, 4, 8, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff66'; ctx.font = '12px monospace';
      drops.forEach((y, i) => {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * 12, y * 12);
        if (y * 12 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      });
    }
    setInterval(drawMatrix, 33);

    // Global State
    let currentMode = "CRYPTO"; // CRYPTO, XM, EXPERT
    let top100Coins = [];
    let displayedCount = 0;
    const PAGE_SIZE = 15;
    let currentSymbol = "BINANCE:BTCUSDT";

    // Dynamic Signal Timestamps for Auto Refresh Logic
    let signalTimestamps = {};

    // Expert Option Fast Assets (5s, 15s, 30s, 60s Timeframes)
    const expertAssets = [
      { symbol: "OANDA:XAUUSD", name: "GOLD (OTC)", prefix: "eo_xauusd", expiry: 5 },
      { symbol: "FX:EURUSD", name: "EUR / USD (OTC)", prefix: "eo_eurusd", expiry: 15 },
      { symbol: "FX:GBPUSD", name: "GBP / USD (OTC)", prefix: "eo_gbpusd", expiry: 30 },
      { symbol: "BINANCE:BTCUSDT", name: "BITCOIN (OTC)", prefix: "eo_btcusdt", expiry: 15 },
      { symbol: "FX:USDJPY", name: "USD / JPY (OTC)", prefix: "eo_usdjpy", expiry: 60 },
      { symbol: "FX:AUDCAD", name: "AUD / CAD (OTC)", prefix: "eo_audcad", expiry: 5 }
    ];

    const xmAssets = [
      { symbol: "OANDA:XAUUSD", name: "GOLD (XAU/USD)", prefix: "xauusd" },
      { symbol: "OANDA:XAGUSD", name: "SILVER (XAG/USD)", prefix: "xagusd" },
      { symbol: "TVC:USOIL", name: "CRUDE OIL", prefix: "usoil" },
      { symbol: "FX:EURUSD", name: "EUR / USD", prefix: "eurusd" },
      { symbol: "FX:GBPUSD", name: "GBP / USD", prefix: "gbpusd" },
      { symbol: "FX:USDJPY", name: "USD / JPY", prefix: "usdjpy" }
    ];

    function addLog(msg) {
      const logContainer = document.getElementById('terminal-logs');
      const time = new Date().toLocaleTimeString();
      logContainer.innerHTML += `<div class="log-line">[${time}] ${msg}</div>`;
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    function switchCategory(mode) {
      currentMode = mode;
      document.getElementById('tab-crypto').classList.toggle('active-tab', mode === 'CRYPTO');
      document.getElementById('tab-xm').classList.toggle('active-tab', mode === 'XM');
      document.getElementById('tab-expert').classList.toggle('active-tab', mode === 'EXPERT');
      
      document.getElementById('signals-container').innerHTML = '';
      document.getElementById('coin-buttons-container').innerHTML = '';

      if (mode === 'CRYPTO') {
        document.getElementById('signals-header-title').innerText = "> NEURAL SIGNALS (CRYPTO 100)";
        document.getElementById('load-more-wrapper').style.display = 'block';
        displayedCount = 0;
        switchChart("BINANCE:BTCUSDT");
        renderMoreCoins();
      } else if (mode === 'XM') {
        document.getElementById('signals-header-title').innerText = "> XM FOREX & METALS TERMINAL";
        document.getElementById('load-more-wrapper').style.display = 'none';
        switchChart("OANDA:XAUUSD");
        renderXMAssets();
      } else if (mode === 'EXPERT') {
        document.getElementById('signals-header-title').innerText = "> EXPERT OPTION (FAST 5s/15s/30s/60s AUTO-REFRESH)";
        document.getElementById('load-more-wrapper').style.display = 'none';
        switchChart("OANDA:XAUUSD");
        renderExpertAssets();
      }
    }

    async function fetchTop100Coins() {
      try {
        addLog(`[FETCH] Syncing Binance Top 100 Pairs...`);
        const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
        const data = await res.json();
        
        top100Coins = data
          .filter(item => item.symbol.endsWith('USDT') && !item.symbol.includes('UP') && !item.symbol.includes('DOWN'))
          .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
          .slice(0, 100)
          .map(item => item.symbol);

        addLog(`[SUCCESS] Synced 100 Cryptos.`);
        if(currentMode === 'CRYPTO') renderMoreCoins();
      } catch (e) {
        addLog(`[ERROR] Crypto Fetch Error.`);
      }
    }

    // Render ExpertOption Fast Assets with Timers
    function renderExpertAssets() {
      const btnContainer = document.getElementById('coin-buttons-container');
      const sigContainer = document.getElementById('signals-container');

      expertAssets.forEach(asset => {
        signalTimestamps[asset.prefix] = Date.now();

        let btn = document.createElement('button');
        btn.className = `coin-btn ${asset.symbol === currentSymbol ? 'active' : ''}`;
        btn.innerText = asset.name.split(' ')[0];
        btn.onclick = function() { switchChart(asset.symbol); };
        btnContainer.appendChild(btn);

        let card = document.createElement('div');
        card.className = `sig-card expert-card ${asset.symbol === currentSymbol ? 'active-card' : ''}`;
        card.id = `card-${asset.prefix}`;
        card.setAttribute('data-coin', asset.name.toLowerCase());
        card.onclick = function() { switchChart(asset.symbol); };

        let isCall = Math.random() > 0.4;
        let accuracy = (89 + Math.random() * 8).toFixed(1);

        card.innerHTML = `
          <div class="sig-top">
            <span class="sig-pair" style="color:var(--expert-color);">${asset.name}</span>
            <div style="display:flex; gap:6px; align-items:center;">
              <span class="signal-timer-badge" id="${asset.prefix}-age">${asset.expiry}s left</span>
              <span class="sig-tag ${isCall ? 'sig-tag-expert' : 'sig-tag-sell'}" id="${asset.prefix}-signal-tag">${isCall ? 'CALL (BUY)' : 'PUT (SELL)'}</span>
            </div>
          </div>
          <div class="sig-grid">
            <div><div class="sig-lbl">Expiry</div><div class="sig-val" style="color:var(--expert-color);">${asset.expiry}s</div></div>
            <div><div class="sig-lbl">Action</div><div class="sig-val" id="${asset.prefix}-action" style="color:${isCall ? 'var(--matrix-green)' : 'var(--red-sell)'};">${isCall ? 'HIGHER ▲' : 'LOWER ▼'}</div></div>
            <div><div class="sig-lbl">Accuracy</div><div class="sig-val" id="${asset.prefix}-acc" style="color:#fff;">${accuracy}%</div></div>
          </div>
        `;
        sigContainer.appendChild(card);
      });
      addLog(`[EXPERT_OPTION] Fast Auto-Refresh Signals Loaded.`);
    }

    function renderXMAssets() {
      const btnContainer = document.getElementById('coin-buttons-container');
      const sigContainer = document.getElementById('signals-container');

      xmAssets.forEach(asset => {
        let btn = document.createElement('button');
        btn.className = `coin-btn ${asset.symbol === currentSymbol ? 'active' : ''}`;
        btn.innerText = asset.name.split(' ')[0];
        btn.onclick = function() { switchChart(asset.symbol); };
        btnContainer.appendChild(btn);

        let card = document.createElement('div');
        card.className = `sig-card ${asset.symbol.includes('XAU') ? 'gold-card' : ''} ${asset.symbol === currentSymbol ? 'active-card' : ''}`;
        card.id = `card-${asset.prefix}`;
        card.setAttribute('data-coin', asset.name.toLowerCase());
        card.onclick = function() { switchChart(asset.symbol); };

        card.innerHTML = `
          <div class="sig-top">
            <span class="sig-pair" style="${asset.symbol.includes('XAU') ? 'color:var(--gold-color)' : ''}">${asset.name}</span>
            <span class="sig-tag sig-tag-buy">ACTIVE</span>
          </div>
          <div class="sig-grid">
            <div><div class="sig-lbl">Signal</div><div class="sig-val" style="color:#fff;">ANALYZING</div></div>
            <div><div class="sig-lbl">Timeframe</div><div class="sig-val" style="color:var(--matrix-green);">15M / 1H</div></div>
            <div><div class="sig-lbl">Broker</div><div class="sig-val" style="color:var(--gold-color);">XM METALS</div></div>
          </div>
        `;
        sigContainer.appendChild(card);
      });
    }

    function renderMoreCoins() {
      const btnContainer = document.getElementById('coin-buttons-container');
      const sigContainer = document.getElementById('signals-container');

      let nextBatch = top100Coins.slice(displayedCount, displayedCount + PAGE_SIZE);

      nextBatch.forEach((symbol) => {
        let coinName = symbol.replace('USDT', '');
        let prefix = symbol.toLowerCase();

        let btn = document.createElement('button');
        btn.className = `coin-btn ${symbol === 'BTCUSDT' ? 'active' : ''}`;
        btn.innerText = coinName;
        btn.onclick = function() { switchChart(`BINANCE:${symbol}`); };
        btnContainer.appendChild(btn);

        let card = document.createElement('div');
        card.className = `sig-card ${symbol === 'BTCUSDT' ? 'active-card' : ''}`;
        card.id = `card-${symbol}`;
        card.setAttribute('data-coin', coinName.toLowerCase());
        card.onclick = function() { switchChart(`BINANCE:${symbol}`); };

        card.innerHTML = `
          <div class="sig-top">
            <span class="sig-pair">${coinName}/USDT</span>
            <span class="sig-tag sig-tag-buy" id="${prefix}-signal-tag">SCANNING</span>
          </div>
          <div class="sig-grid">
            <div><div class="sig-lbl">Entry</div><div class="sig-val" id="${prefix}-entry">--</div></div>
            <div><div class="sig-lbl">Target</div><div class="sig-val" style="color:var(--matrix-green);" id="${prefix}-tp">--</div></div>
            <div><div class="sig-lbl">Stop</div><div class="sig-val" style="color:var(--red-sell);" id="${prefix}-sl">--</div></div>
          </div>
        `;
        sigContainer.appendChild(card);
      });

      displayedCount += nextBatch.length;
      if(displayedCount >= top100Coins.length) {
        document.getElementById('loadMoreBtn').style.display = 'none';
      }
      fetchLivePrices();
    }

    // Core Engine: 5s, 15s, 30s, 60s Auto-Refresh Logic
    function handleExpertOptionAutoRefresh() {
      if (currentMode !== 'EXPERT') return;

      const now = Date.now();

      expertAssets.forEach(asset => {
        let card = document.getElementById(`card-${asset.prefix}`);
        let ageElem = document.getElementById(`${asset.prefix}-age`);
        let tagElem = document.getElementById(`${asset.prefix}-signal-tag`);
        let actionElem = document.getElementById(`${asset.prefix}-action`);
        let accElem = document.getElementById(`${asset.prefix}-acc`);

        if (!card || !ageElem) return;

        let durationMs = asset.expiry * 1000;
        let elapsed = now - signalTimestamps[asset.prefix];
        let remaining = Math.ceil((durationMs - elapsed) / 1000);

        if (remaining > 0) {
          ageElem.innerText = `${remaining}s left`;
          ageElem.style.color = remaining <= 2 ? "var(--red-sell)" : "var(--expert-color)";
        } else {
          // Timer Hit 0 -> AUTO REFRESH SIGNAL NOW
          signalTimestamps[asset.prefix] = now; // Reset timer start

          let isCall = Math.random() > 0.45; 
          let accuracy = (89 + Math.random() * 8).toFixed(1);

          tagElem.innerText = isCall ? "CALL (BUY)" : "PUT (SELL)";
          tagElem.className = isCall ? "sig-tag sig-tag-expert" : "sig-tag sig-tag-sell";

          actionElem.innerText = isCall ? "HIGHER ▲" : "LOWER ▼";
          actionElem.style.color = isCall ? "var(--matrix-green)" : "var(--red-sell)";

          if(accElem) accElem.innerText = `${accuracy}%`;

          // Visual Flash Alert
          card.style.transition = "0.1s";
          card.style.boxShadow = "0 0 25px var(--expert-color)";
          setTimeout(() => { card.style.boxShadow = ""; }, 400);

          addLog(`[AUTO_REFRESH] ${asset.name} (${asset.expiry}s) Expiry Done -> New Signal Generated!`);
        }
      });
    }

    function loadTradingViewChart(symbol) {
      document.getElementById("tv_chart_container").innerHTML = "";
      let readableName = symbol.replace('BINANCE:', '').replace('OANDA:', '').replace('FX:', '').replace('TVC:', '');
      document.getElementById("current-symbol-title").innerText = readableName;

      new TradingView.widget({
        "autosize": true,
        "symbol": symbol,
        "interval": "1",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#020604",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "container_id": "tv_chart_container"
      });
    }

    function switchChart(symbol) {
      currentSymbol = symbol;
      loadTradingViewChart(symbol);
      addLog(`[TERMINAL] Switched Chart View: ${symbol}`);
    }

    function filterCoins() {
      let input = document.getElementById('coinSearch').value.toLowerCase();
      let cards = document.querySelectorAll('.sig-card');
      cards.forEach(card => {
        let coin = card.getAttribute('data-coin');
        card.style.display = coin.includes(input) ? "block" : "none";
      });
    }

    async function fetchLivePrices() {
      if(currentMode !== 'CRYPTO' || top100Coins.length === 0) return;
      try {
        const symbolsParam = JSON.stringify(top100Coins.slice(0, displayedCount));
        const response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=${symbolsParam}`);
        const data = await response.json();

        data.forEach(item => {
          let price = parseFloat(item.lastPrice);
          let change = parseFloat(item.priceChangePercent);
          let symbol = item.symbol;
          let isBuy = change >= 0;

          let decimals = price < 1 ? (price < 0.001 ? 6 : 4) : 2;
          let entryFormatted = '$' + price.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
          let tpPrice = isBuy ? price * 1.025 : price * 0.975;
          let slPrice = isBuy ? price * 0.985 : price * 1.015;

          let prefix = symbol.toLowerCase();
          if(document.getElementById(prefix + '-entry')) document.getElementById(prefix + '-entry').innerText = entryFormatted;
          if(document.getElementById(prefix + '-tp')) document.getElementById(prefix + '-tp').innerText = '$' + tpPrice.toFixed(2);
          if(document.getElementById(prefix + '-sl')) document.getElementById(prefix + '-sl').innerText = '$' + slPrice.toFixed(2);

          let tagElem = document.getElementById(prefix + '-signal-tag');
          if(tagElem) {
            tagElem.innerText = isBuy ? "BUY" : "SELL";
            tagElem.className = isBuy ? "sig-tag sig-tag-buy" : "sig-tag sig-tag-sell";
          }
        });
      } catch (err) {}
    }

    // Init App
    loadTradingViewChart(currentSymbol);
    fetchTop100Coins();
    setInterval(fetchLivePrices, 3000);
    setInterval(handleExpertOptionAutoRefresh, 200); // Check Refresh Logic Every 200ms
  </script>

</body>
</html>
