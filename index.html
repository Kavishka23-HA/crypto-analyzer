<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="xtttowHOr_ogoG4Qo8ozArR_wI0g7n51zMJ-8qbQbUE" />
  <meta name="description" content="Futuristic AI-powered real-time crypto chart and signal terminal for Top 20 Cryptocurrencies.">
  <meta name="keywords" content="crypto analyzer, bitcoin live chart, crypto signals free, tradingview signals, btc eth chart">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRYPTO-PULSE AI | Next-Gen Trading Terminal</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #04070d;
      --card-bg: rgba(13, 19, 32, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-glow: rgba(0, 242, 254, 0.3);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-purple: #7f53ac;
      --green-buy: #00e676;
      --green-glow: rgba(0, 230, 118, 0.3);
      --red-sell: #ff1744;
      --red-glow: rgba(255, 23, 68, 0.3);
      --text-main: #f8fafc;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: var(--bg-dark); 
      background-image: 
        radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(127, 83, 172, 0.08) 0px, transparent 50%);
      color: var(--text-main); 
      min-height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow-x: hidden;
    }

    /* Top Ticker Bar Styling */
    .ticker-container { 
      width: 100%; 
      background: rgba(6, 10, 18, 0.95); 
      border-bottom: 1px solid var(--card-border); 
      backdrop-filter: blur(10px);
    }

    /* Header */
    header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 16px 32px; 
      background: rgba(10, 15, 26, 0.8); 
      backdrop-filter: blur(20px); 
      border-bottom: 1px solid var(--card-border); 
    }
    
    .brand-logo { 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      font-weight: 800; 
      font-size: 22px; 
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); 
      -webkit-background-clip: text; 
      -webkit-text-fill-color: transparent; 
    }
    
    .brand-logo .logo-icon { 
      width: 36px; 
      height: 36px; 
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); 
      border-radius: 10px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      color: #000; 
      font-weight: 900; 
      font-size: 18px;
      -webkit-text-fill-color: initial;
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
    }

    .badge-status { 
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 242, 254, 0.06); 
      color: var(--accent-cyan); 
      border: 1px solid rgba(0, 242, 254, 0.2); 
      padding: 8px 16px; 
      border-radius: 30px; 
      font-weight: 700; 
      font-size: 13px; 
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.1);
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: var(--green-buy);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green-buy);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.2); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* Layout Dashboard */
    .dashboard-container { 
      display: grid; 
      grid-template-columns: 2.8fr 1.2fr; 
      gap: 24px; 
      padding: 24px; 
      max-width: 1800px; 
      margin: 0 auto; 
      width: 100%; 
      flex: 1; 
    }

    .glass-card { 
      background: var(--card-bg); 
      border: 1px solid var(--card-border); 
      border-radius: 20px; 
      backdrop-filter: blur(20px); 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      transition: border-color 0.3s;
    }

    .chart-section { height: 800px; }
    .signal-section { height: 800px; }

    /* Header Controls */
    .section-header { 
      padding: 16px 24px; 
      border-bottom: 1px solid var(--card-border); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      flex-wrap: wrap; 
      gap: 12px; 
      background: rgba(255, 255, 255, 0.01);
    }
    
    .section-title { 
      font-size: 15px; 
      font-weight: 700; 
      display: flex; 
      align-items: center; 
      gap: 10px; 
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .active-symbol-badge {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 800;
      letter-spacing: 0;
    }

    /* Coin Selector Toolbar */
    .coin-selector-group { 
      display: flex; 
      gap: 8px; 
      overflow-x: auto; 
      max-width: 100%; 
      padding-bottom: 4px; 
      align-items: center;
    }
    .coin-selector-group::-webkit-scrollbar { height: 4px; }
    .coin-selector-group::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
    
    .coin-btn { 
      background: rgba(255,255,255,0.03); 
      border: 1px solid var(--card-border); 
      color: var(--text-muted); 
      padding: 8px 16px; 
      border-radius: 10px; 
      font-weight: 700; 
      font-size: 12px; 
      cursor: pointer; 
      transition: all 0.25s ease; 
      white-space: nowrap; 
    }
    .coin-btn:hover { 
      background: rgba(255,255,255,0.08); 
      color: var(--text-main); 
      border-color: rgba(255,255,255,0.2);
    }
    .coin-btn.active { 
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); 
      color: #000; 
      border-color: transparent; 
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
    }

    /* Search Input */
    .search-box {
      position: relative;
      width: 100%;
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-border);
    }
    .search-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      padding: 10px 14px;
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: 0.3s;
    }
    .search-input:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
    }

    /* Signal Scroll Container */
    .signal-scroll-area { 
      padding: 16px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 12px; 
      flex: 1; 
    }
    .signal-scroll-area::-webkit-scrollbar { width: 5px; }
    .signal-scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }

    /* Futuristic Signal Card */
    .sig-card { 
      background: rgba(255,255,255,0.02); 
      border: 1px solid var(--card-border); 
      border-radius: 14px; 
      padding: 16px; 
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
      cursor: pointer; 
      position: relative;
    }
    .sig-card:hover { 
      border-color: rgba(255,255,255,0.2); 
      transform: translateY(-2px);
      background: rgba(255,255,255,0.04);
    }
    .sig-card.active-card { 
      border-color: var(--accent-cyan); 
      background: rgba(0, 242, 254, 0.04); 
      box-shadow: inset 0 0 15px rgba(0, 242, 254, 0.05), 0 4px 20px rgba(0,0,0,0.3);
    }
    .sig-top { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 12px; 
    }
    .sig-pair { 
      font-weight: 800; 
      font-size: 15px; 
      letter-spacing: 0.3px;
    }
    
    /* Signal Badges */
    .sig-tag {
      padding: 5px 12px; 
      border-radius: 8px; 
      font-size: 11px; 
      font-weight: 800; 
      letter-spacing: 0.5px;
    }
    .sig-tag-buy { 
      background: rgba(0, 230, 118, 0.12); 
      color: var(--green-buy); 
      border: 1px solid var(--green-buy); 
      box-shadow: 0 0 10px var(--green-glow);
    }
    .sig-tag-sell { 
      background: rgba(255, 23, 68, 0.12); 
      color: var(--red-sell); 
      border: 1px solid var(--red-sell); 
      box-shadow: 0 0 10px var(--red-glow);
    }

    /* Signal Values Grid */
    .sig-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr 1fr; 
      gap: 10px; 
      text-align: center; 
      background: rgba(0, 0, 0, 0.2);
      padding: 10px;
      border-radius: 10px;
    }
    .sig-val { 
      font-size: 13px; 
      font-weight: 700; 
      margin-top: 3px; 
    }
    .sig-lbl { 
      font-size: 10px; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      font-weight: 600;
    }

    @media (max-width: 1200px) { 
      .dashboard-container { grid-template-columns: 1fr; } 
      .chart-section { height: 550px; } 
      .signal-section { height: 600px; } 
    }
  </style>
</head>
<body>

  <!-- Top Market Ticker Tape -->
  <div class="ticker-container">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "proName": "BINANCE:BTCUSDT", "title": "Bitcoin" },
          { "proName": "BINANCE:ETHUSDT", "title": "Ethereum" },
          { "proName": "BINANCE:SOLUSDT", "title": "Solana" },
          { "proName": "BINANCE:BNBUSDT", "title": "BNB" },
          { "proName": "BINANCE:XRPUSDT", "title": "XRP" },
          { "proName": "BINANCE:ADAUSDT", "title": "Cardano" },
          { "proName": "BINANCE:DOGEUSDT", "title": "Dogecoin" }
        ],
        "colorTheme": "dark", "isTransparent": true, "displayMode": "adaptive", "locale": "en"
      }
      </script>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="brand-logo">
      <div class="logo-icon">⚡</div>
      <span>CRYPTO-PULSE AI</span>
    </div>
    <div class="badge-status">
      <span class="live-dot"></span>
      <span>REAL-TIME TERMINAL</span>
    </div>
  </header>

  <!-- Main Dashboard -->
  <div class="dashboard-container">
    
    <!-- Chart Box -->
    <div class="glass-card chart-section">
      <div class="section-header">
        <div class="section-title">
          <span>Chart View:</span> 
          <span class="active-symbol-badge" id="current-symbol-title">BTC/USDT</span>
        </div>
        <div class="coin-selector-group" id="coin-buttons-container"></div>
      </div>
      <div style="flex: 1; width: 100%; height: 100%; position: relative;">
        <div id="tv_chart_container" style="height:100%; width:100%"></div>
      </div>
    </div>

    <!-- Signals Box -->
    <div class="glass-card signal-section">
      <div class="section-header">
        <div class="section-title">🎯 Market Signals (20 Crypto Coins)</div>
      </div>

      <!-- Quick Search Bar -->
      <div class="search-box">
        <input type="text" id="coinSearch" class="search-input" placeholder="🔍 Search Coin (e.g. SOL, XRP, DOGE)..." onkeyup="filterCoins()">
      </div>

      <div class="signal-scroll-area" id="signals-container"></div>
    </div>

  </div>

  <!-- TradingView JS Library -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script>
    const coinList = [
      "BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT",
      "ADAUSDT", "DOGEUSDT", "AVAXUSDT", "LINKUSDT", "DOTUSDT",
      "MATICUSDT", "SHIBUSDT", "LTCUSDT", "NEARUSDT", "ATOMUSDT",
      "UNIUSDT", "APTUSDT", "SUIUSDT", "TRXUSDT", "XLMUSDT"
    ];

    let currentSymbol = "BINANCE:BTCUSDT";

    // Dynamic UI Construction
    function buildUI() {
      const btnContainer = document.getElementById('coin-buttons-container');
      const sigContainer = document.getElementById('signals-container');

      btnContainer.innerHTML = '';
      sigContainer.innerHTML = '';

      coinList.forEach((symbol, index) => {
        let coinName = symbol.replace('USDT', '');
        
        // Buttons
        let btn = document.createElement('button');
        btn.className = `coin-btn ${index === 0 ? 'active' : ''}`;
        btn.innerText = coinName;
        btn.onclick = function() { switchChart(`BINANCE:${symbol}`, this); };
        btnContainer.appendChild(btn);

        // Signal Cards
        let card = document.createElement('div');
        card.className = `sig-card ${index === 0 ? 'active-card' : ''}`;
        card.id = `card-${symbol}`;
        card.setAttribute('data-coin', coinName.toLowerCase());
        card.onclick = function() { switchChart(`BINANCE:${symbol}`); };

        let prefix = coinName.toLowerCase();
        card.innerHTML = `
          <div class="sig-top">
            <span class="sig-pair">${coinName} / USDT <small style="font-size:10px; color:var(--text-muted); font-weight:normal;">15m</small></span>
            <span class="sig-tag sig-tag-buy" id="${prefix}-signal-tag">FETCHING</span>
          </div>
          <div class="sig-grid">
            <div><div class="sig-lbl">Entry</div><div class="sig-val" id="${prefix}-entry">--</div></div>
            <div><div class="sig-lbl">Take Profit</div><div class="sig-val" style="color:var(--green-buy);" id="${prefix}-tp">--</div></div>
            <div><div class="sig-lbl">Stop Loss</div><div class="sig-val" style="color:var(--red-sell);" id="${prefix}-sl">--</div></div>
          </div>
        `;
        sigContainer.appendChild(card);
      });
    }

    // Chart Renderer
    function loadTradingViewChart(symbol) {
      document.getElementById("tv_chart_container").innerHTML = "";
      
      let readableName = symbol.replace('BINANCE:', '').replace('USDT', '') + '/USDT';
      document.getElementById("current-symbol-title").innerText = readableName;

      new TradingView.widget({
        "autosize": true,
        "symbol": symbol,
        "interval": "15",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#060a12",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "container_id": "tv_chart_container"
      });
    }

    // Switch Symbol
    function switchChart(symbol, btnElement) {
      currentSymbol = symbol;
      loadTradingViewChart(symbol);

      let targetCoin = symbol.replace('BINANCE:', '').replace('USDT', '');

      document.querySelectorAll('.coin-btn').forEach(btn => {
        if (btn.innerText === targetCoin) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      let rawPair = symbol.replace('BINANCE:', '');
      document.querySelectorAll('.sig-card').forEach(card => card.classList.remove('active-card'));
      let activeCard = document.getElementById('card-' + rawPair);
      if (activeCard) activeCard.classList.add('active-card');
    }

    // Search Filtering
    function filterCoins() {
      let input = document.getElementById('coinSearch').value.toLowerCase();
      let cards = document.querySelectorAll('.sig-card');

      cards.forEach(card => {
        let coin = card.getAttribute('data-coin');
        if (coin.includes(input)) {
          card.style.display = "block";
        } else {
          card.style.display = "none";
        }
      });
    }

    // Binance Price Fetcher & Signal Generator
    async function fetchLiveMarketPrices() {
      try {
        const symbolsParam = JSON.stringify(coinList);
        const response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=${symbolsParam}`);
        const data = await response.json();

        data.forEach(item => {
          let price = parseFloat(item.lastPrice);
          let change = parseFloat(item.priceChangePercent);
          let symbol = item.symbol;

          let isBuy = change >= 0;

          let decimals = price < 1 ? (price < 0.001 ? 6 : 4) : 2;
          let entryFormatted = '$' + price.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
          let tpPrice = isBuy ? price * 1.025 : price * 0.975;
          let slPrice = isBuy ? price * 0.985 : price * 1.015;

          let tpFormatted = '$' + tpPrice.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
          let slFormatted = '$' + slPrice.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});

          let prefix = symbol.replace('USDT', '').toLowerCase();

          if(document.getElementById(prefix + '-entry')) document.getElementById(prefix + '-entry').innerText = entryFormatted;
          if(document.getElementById(prefix + '-tp')) document.getElementById(prefix + '-tp').innerText = tpFormatted;
          if(document.getElementById(prefix + '-sl')) document.getElementById(prefix + '-sl').innerText = slFormatted;

          let tagElem = document.getElementById(prefix + '-signal-tag');
          if(tagElem) {
            if (isBuy) {
              tagElem.innerText = change > 2.0 ? "STRONG BUY" : "BUY";
              tagElem.className = "sig-tag sig-tag-buy";
            } else {
              tagElem.innerText = change < -2.0 ? "STRONG SELL" : "SELL";
              tagElem.className = "sig-tag sig-tag-sell";
            }
          }
        });
      } catch (err) {
        console.error("Live price sync error: ", err);
      }
    }

    // App Initialization
    buildUI();
    loadTradingViewChart(currentSymbol);
    fetchLiveMarketPrices();
    setInterval(fetchLiveMarketPrices, 3000);
  </script>

</body>
</html>
