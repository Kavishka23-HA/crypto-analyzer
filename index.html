  <style>
    :root {
      --bg-dark: #020408;
      --card-bg: rgba(5, 12, 8, 0.88);
      --card-border: rgba(0, 255, 102, 0.25);
      --matrix-green: #00ff66;
      --matrix-green-glow: rgba(0, 255, 102, 0.4);
      --red-sell: #ff0055;
      --red-glow: rgba(255, 0, 85, 0.4);
      --text-main: #00ff66;
      --text-muted: #4e8060;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

    body {
      font-family: 'Fira Code', monospace;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      position: relative;
    }

    /* SECURITY LOCK OVERLAY */
    #security-lockscreen {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #020408;
      z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      border: 2px solid var(--matrix-green);
    }

    .lock-box {
      background: rgba(5, 12, 8, 0.95);
      border: 1px solid var(--matrix-green);
      padding: 30px; border-radius: 8px;
      box-shadow: 0 0 25px var(--matrix-green-glow);
      text-align: center; max-width: 420px; width: 90%;
    }

    .lock-title {
      font-size: 16px; font-weight: 700; color: var(--matrix-green);
      margin-bottom: 15px; letter-spacing: 1px;
    }

    .lock-input {
      width: 100%; padding: 12px;
      background: #000; border: 1px solid var(--card-border);
      color: var(--matrix-green); font-family: 'Fira Code', monospace;
      font-size: 14px; text-align: center; outline: none;
      border-radius: 4px; margin-bottom: 15px;
    }
    .lock-input:focus { border-color: var(--matrix-green); box-shadow: 0 0 10px var(--matrix-green-glow); }

    .lock-btn {
      width: 100%; padding: 12px;
      background: var(--matrix-green); color: #000;
      font-weight: 700; border: none; border-radius: 4px;
      cursor: pointer; font-family: 'Fira Code', monospace;
      transition: 0.2s;
    }
    .lock-btn:hover { box-shadow: 0 0 15px var(--matrix-green-glow); }

    #error-msg {
      color: var(--red-sell); font-size: 11px; margin-top: 10px; display: none;
    }

    /* Matrix Rain Canvas */
    #matrix-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      opacity: 0.12;
      pointer-events: none;
    }

    body::before {
      content: " ";
      display: block;
      position: fixed;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 10;
      background-size: 100% 3px, 3px 100%;
      pointer-events: none;
    }

    .ticker-container {
      position: relative; z-index: 2;
      width: 100%; background: rgba(2, 6, 4, 0.95);
      border-bottom: 1px solid var(--card-border);
    }

    header {
      position: relative; z-index: 2;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 32px;
      background: rgba(3, 8, 5, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
    }

    .brand-logo {
      display: flex; align-items: center; gap: 12px;
      font-weight: 700; font-size: 20px;
      color: var(--matrix-green);
      text-shadow: 0 0 10px var(--matrix-green-glow);
    }

    .brand-logo .logo-icon {
      width: 34px; height: 34px;
      border: 1px solid var(--matrix-green);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 12px var(--matrix-green-glow);
      animation: pulse 2s infinite;
    }

    .badge-status {
      display: flex; align-items: center; gap: 8px;
      background: rgba(0, 255, 102, 0.05);
      color: var(--matrix-green);
      border: 1px solid var(--matrix-green);
      padding: 6px 14px; border-radius: 4px;
      font-size: 12px; box-shadow: 0 0 10px var(--matrix-green-glow);
    }

    .live-dot {
      width: 8px; height: 8px;
      background-color: var(--matrix-green);
      border-radius: 50%;
      animation: blink 1s infinite alternate;
    }

    @keyframes blink { 0% { opacity: 0.2; } 100% { opacity: 1; } }
    @keyframes pulse { 0% { box-shadow: 0 0 5px var(--matrix-green); } 50% { box-shadow: 0 0 20px var(--matrix-green); } 100% { box-shadow: 0 0 5px var(--matrix-green); } }

    .dashboard-container {
      position: relative; z-index: 2;
      display: grid; grid-template-columns: 2.8fr 1.2fr;
      gap: 20px; padding: 20px;
      max-width: 1800px; margin: 0 auto;
      width: 100%; flex: 1;
    }

    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      backdrop-filter: blur(16px);
      overflow: hidden;
      display: flex; flex-direction: column;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
    }

    .chart-section { height: 780px; }
    .signal-section { height: 780px; }

    .section-header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--card-border);
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px;
      background: rgba(0, 255, 102, 0.02);
    }

    .section-title {
      font-size: 13px; font-weight: 600;
      color: var(--matrix-green);
      text-transform: uppercase; letter-spacing: 1px;
    }

    .coin-selector-group {
      display: flex; gap: 6px;
      overflow-x: auto; max-width: 100%;
      padding-bottom: 4px;
    }
    .coin-selector-group::-webkit-scrollbar { height: 3px; }
    .coin-selector-group::-webkit-scrollbar-thumb { background: var(--card-border); }

    .coin-btn {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 12px; border-radius: 4px;
      font-family: 'Fira Code', monospace;
      font-size: 11px; cursor: pointer; transition: all 0.2s;
      white-space: nowrap;
    }
    .coin-btn:hover, .coin-btn.active {
      background: var(--matrix-green); color: #000;
      font-weight: 700; box-shadow: 0 0 10px var(--matrix-green-glow);
    }

    .search-box { padding: 10px 14px; border-bottom: 1px solid var(--card-border); }
    .search-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--card-border);
      padding: 8px 12px; border-radius: 4px;
      color: var(--matrix-green);
      font-family: 'Fira Code', monospace;
      font-size: 12px; outline: none;
    }

    .signal-scroll-area {
      padding: 14px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
      flex: 1;
    }

    .sig-card {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--card-border);
      border-radius: 6px; padding: 12px;
      transition: all 0.2s ease; cursor: pointer;
    }
    .sig-card:hover { border-color: var(--matrix-green); box-shadow: 0 0 12px var(--matrix-green-glow); }
    .sig-card.active-card { border-color: var(--matrix-green); background: rgba(0, 255, 102, 0.08); }

    .sig-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .sig-pair { font-weight: 700; font-size: 14px; color: #fff; }

    .sig-tag { padding: 3px 8px; border-radius: 3px; font-size: 10px; font-weight: 700; }
    .sig-tag-buy { background: rgba(0, 255, 102, 0.15); color: var(--matrix-green); border: 1px solid var(--matrix-green); }
    .sig-tag-sell { background: rgba(255, 0, 85, 0.15); color: var(--red-sell); border: 1px solid var(--red-sell); }

    .sig-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 6px; text-align: center;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px; border-radius: 4px;
    }
    .sig-val { font-size: 12px; font-weight: 600; margin-top: 2px; }
    .sig-lbl { font-size: 9px; color: var(--text-muted); text-transform: uppercase; }

    .load-more-btn {
      background: rgba(0, 255, 102, 0.1);
      border: 1px solid var(--matrix-green);
      color: var(--matrix-green);
      padding: 10px; text-align: center;
      font-family: 'Fira Code', monospace;
      font-size: 11px; font-weight: 700;
      cursor: pointer; border-radius: 4px;
      width: 100%;
    }

    .terminal-logs {
      position: relative; z-index: 2;
      margin: 0 20px 20px 20px;
      background: rgba(0, 5, 2, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 6px; padding: 10px 16px;
      font-size: 11px; color: var(--matrix-green);
      height: 60px; overflow-y: auto;
    }
    .log-line { opacity: 0.8; margin-bottom: 2px; }

    @media (max-width: 1200px) {
      .dashboard-container { grid-template-columns: 1fr; }
      .chart-section, .signal-section { height: 500px; }
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <!-- SECURITY OVERLAY SCREEN -->
  <div id="security-lockscreen">
    <div class="lock-box">
      <div class="lock-title">&gt;_ ENTER CLIENT ACCESS KEY</div>
      <input type="password" id="clientPass" class="lock-input" placeholder="ACCESS KEY..." autofocus>
      <button class="lock-btn" onclick="validateKey()">AUTHENTICATE</button>
      <div id="error-msg">[ERROR] ACCESS DENIED: INVALID KEY</div>
    </div>
  </div>

  <canvas id="matrix-canvas"></canvas>

  <div class="ticker-container">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "proName": "BINANCE:BTCUSDT", "title": "BTC" },
          { "proName": "BINANCE:ETHUSDT", "title": "ETH" },
          { "proName": "BINANCE:SOLUSDT", "title": "SOL" }
        ],
        "colorTheme": "dark", "isTransparent": true, "displayMode": "adaptive", "locale": "en"
      }
      </script>
    </div>
  </div>

  <header>
    <div class="brand-logo">
      <div class="logo-icon">&gt;_</div>
      <span>CYBER-PULSE // TOP 100 MATRIX</span>
    </div>
    <div class="badge-status">
      <span class="live-dot"></span>
      <span>DYNAMIC TOP 100 FEED</span>
    </div>
  </header>

  <div class="dashboard-container">
    <div class="glass-card chart-section">
      <div class="section-header">
        <div class="section-title">&gt; CHART: <span id="current-symbol-title" style="color:#fff;">BTC/USDT</span></div>
        <div class="coin-selector-group" id="coin-buttons-container"></div>
      </div>
      <div style="flex: 1; width: 100%; height: 100%;">
        <div id="tv_chart_container" style="height:100%; width:100%"></div>
      </div>
    </div>

    <div class="glass-card signal-section">
      <div class="section-header">
        <div class="section-title">&gt; NEURAL SIGNALS (TOP 100)</div>
      </div>
      <div class="search-box">
        <input type="text" id="coinSearch" class="search-input" placeholder="root@matrix:~# search..." onkeyup="filterCoins()">
      </div>
      <div class="signal-scroll-area" id="signals-container"></div>
      <div style="padding: 10px;"><button class="load-more-btn" id="loadMoreBtn" onclick="renderMoreCoins()">[+] LOAD MORE COINS</button></div>
    </div>
  </div>

  <div class="terminal-logs" id="terminal-logs">
    <div class="log-line">[SYS_INIT] Initializing Security Layer...</div>
  </div>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

  <!-- SUPABASE & AUTHENTICATION LOGIC -->
  <script>
    // Supabase URL සහ Publishable Key
    const SUPABASE_URL = "https://motvjjunbapbhtryekki.supabase.co";
    const SUPABASE_KEY = "sb_publishable_dKhxbEmZIf9KZ614SgudVw_CXbnyjc5"; // ඔයාගේ සම්පූර්ණ Publishable Key එක මෙතනට Paste කරන්න

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function getDeviceId() {
      let devId = localStorage.getItem('user_device_id');
      if (!devId) {
        devId = 'DEV-' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
        localStorage.setItem('user_device_id', devId);
      }
      return devId;
    }

    async function validateKey() {
      const enteredKey = document.getElementById('clientPass').value.trim();
      const errorMsg = document.getElementById('error-msg');
      const currentDeviceId = getDeviceId();

      if (!enteredKey) {
        errorMsg.innerText = "[ERROR] PLEASE ENTER A KEY";
        errorMsg.style.display = 'block';
        return;
      }

      const { data, error } = await supabaseClient
        .from('license_keys')
        .select('*')
        .eq('key', enteredKey)
        .single();

      if (error || !data) {
        errorMsg.innerText = "[ERROR] ACCESS DENIED: INVALID KEY";
        errorMsg.style.display = 'block';
        addLog('[AUTH_FAILED] Invalid Key Attempt.');
        return;
      }

      // --- ADMIN KEY CHECK ---
      if (data.is_admin === true) {
        document.getElementById('security-lockscreen').style.display = 'none';
        addLog('[AUTH_SUCCESS] Admin Access Granted.');
        initApp();
        return;
      }

      // --- CLIENT KEY CHECK (ONE-DEVICE LOCK) ---
      if (data.device_id === null) {
        await supabaseClient
          .from('license_keys')
          .update({ device_id: currentDeviceId })
          .eq('key', enteredKey);

        document.getElementById('security-lockscreen').style.display = 'none';
        addLog('[AUTH_SUCCESS] Key locked to this device. Terminal Unlocked.');
        initApp();

      } else if (data.device_id === currentDeviceId) {
        document.getElementById('security-lockscreen').style.display = 'none';
        addLog('[AUTH_SUCCESS] License Verified. Terminal Unlocked.');
        initApp();

      } else {
        errorMsg.innerText = "[ERROR] KEY LOCKED TO ANOTHER DEVICE";
        errorMsg.style.display = 'block';
        addLog('[AUTH_FAILED] Key locked to another device.');
      }
    }

    // Disable Inspect Element Shortcuts
    document.onkeydown = function(e) {
      if (e.keyCode == 123 || 
         (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) ||
         (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0))) {
        return false;
      }
    };

    // Matrix Rain Effect
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const chars = '0123456789ABCDEF%&*/<>#@$';
    const drops = Array(Math.floor(canvas.width / 12)).fill(1);
    function drawMatrix() {
      ctx.fillStyle = 'rgba(2, 4, 8, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff66'; ctx.font = '12px monospace';
      drops.forEach((y, i) => {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * 12, y * 12);
        if (y * 12 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      });
    }
    setInterval(drawMatrix, 33);

    // Terminal Core Logic
    let top100Coins = [];
    let displayedCount = 0;
    const PAGE_SIZE = 15;
    let currentSymbol = "BINANCE:BTCUSDT";

    function addLog(msg) {
      const logContainer = document.getElementById('terminal-logs');
      const time = new Date().toLocaleTimeString();
      logContainer.innerHTML += `<div class="log-line">[${time}] ${msg}</div>`;
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    async function fetchTop100Coins() {
      try {
        addLog(`[FETCH] Syncing Top 100 Volume Pairs...`);
        const res = await fetch('https://api.binance.com/api/v3/ticker/24hr');
        const data = await res.json();
        
        top100Coins = data
          .filter(item => item.symbol.endsWith('USDT') && !item.symbol.includes('UP') && !item.symbol.includes('DOWN'))
          .sort((a, b) => parseFloat(b.quoteVolume) - parseFloat(a.quoteVolume))
          .slice(0, 100)
          .map(item => item.symbol);

        addLog(`[SUCCESS] Loaded Top ${top100Coins.length} Crypto Pairs.`);
        renderMoreCoins();
        fetchLivePrices();
      } catch (e) {
        addLog(`[ERROR] Crypto Fetch Error.`);
      }
    }

    function renderMoreCoins() {
      const btnContainer = document.getElementById('coin-buttons-container');
      const sigContainer = document.getElementById('signals-container');

      let nextBatch = top100Coins.slice(displayedCount, displayedCount + PAGE_SIZE);

      nextBatch.forEach((symbol) => {
        let coinName = symbol.replace('USDT', '');
        let btn = document.createElement('button');
        btn.className = `coin-btn ${symbol === 'BTCUSDT' ? 'active' : ''}`;
        btn.innerText = coinName;
        btn.onclick = function() { switchChart(`BINANCE:${symbol}`); };
        btnContainer.appendChild(btn);

        let card = document.createElement('div');
        card.className = `sig-card ${symbol === 'BTCUSDT' ? 'active-card' : ''}`;
        card.id = `card-${symbol}`;
        card.setAttribute('data-coin', coinName.toLowerCase());
        card.onclick = function() { switchChart(`BINANCE:${symbol}`); };

        let prefix = symbol.toLowerCase();
        card.innerHTML = `
          <div class="sig-top">
            <span class="sig-pair">${coinName}/USDT <small style="font-size:9px; color:var(--text-muted);">15M</small></span>
            <span class="sig-tag sig-tag-buy" id="${prefix}-signal-tag">SCANNING</span>
          </div>
          <div class="sig-grid">
            <div><div class="sig-lbl">Entry</div><div class="sig-val" id="${prefix}-entry">--</div></div>
            <div><div class="sig-lbl">Target</div><div class="sig-val" style="color:var(--matrix-green);" id="${prefix}-tp">--</div></div>
            <div><div class="sig-lbl">Stop</div><div class="sig-val" style="color:var(--red-sell);" id="${prefix}-sl">--</div></div>
          </div>
        `;
        sigContainer.appendChild(card);
      });

      displayedCount += nextBatch.length;
      if(displayedCount >= top100Coins.length) {
        document.getElementById('loadMoreBtn').style.display = 'none';
      }
      fetchLivePrices();
    }

    function loadTradingViewChart(symbol) {
      document.getElementById("tv_chart_container").innerHTML = "";
      let readableName = symbol.replace('BINANCE:', '').replace('USDT', '') + '/USDT';
      document.getElementById("current-symbol-title").innerText = readableName;

      new TradingView.widget({
        "autosize": true,
        "symbol": symbol,
        "interval": "15",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#020604",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "container_id": "tv_chart_container"
      });
    }

    function switchChart(symbol) {
      currentSymbol = symbol;
      loadTradingViewChart(symbol);
      let targetCoin = symbol.replace('BINANCE:', '').replace('USDT', '');
      document.querySelectorAll('.coin-btn').forEach(btn => btn.classList.toggle('active', btn.innerText === targetCoin));
      let rawPair = symbol.replace('BINANCE:', '');
      document.querySelectorAll('.sig-card').forEach(card => card.classList.remove('active-card'));
      let activeCard = document.getElementById('card-' + rawPair);
      if (activeCard) activeCard.classList.add('active-card');
    }

    function filterCoins() {
      let input = document.getElementById('coinSearch').value.toLowerCase();
      let cards = document.querySelectorAll('.sig-card');
      cards.forEach(card => {
        let coin = card.getAttribute('data-coin');
        card.style.display = coin.includes(input) ? "block" : "none";
      });
    }

    async function fetchLivePrices() {
      if(top100Coins.length === 0) return;
      try {
        const symbolsParam = JSON.stringify(top100Coins.slice(0, displayedCount));
        const response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=${symbolsParam}`);
        const data = await response.json();

        data.forEach(item => {
          let price = parseFloat(item.lastPrice);
          let change = parseFloat(item.priceChangePercent);
          let symbol = item.symbol;
          let isBuy = change >= 0;

          let decimals = price < 1 ? (price < 0.001 ? 6 : 4) : 2;
          let entryFormatted = '$' + price.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
          let tpPrice = isBuy ? price * 1.025 : price * 0.975;
          let slPrice = isBuy ? price * 0.985 : price * 1.015;

          let prefix = symbol.toLowerCase();
          if(document.getElementById(prefix + '-entry')) document.getElementById(prefix + '-entry').innerText = entryFormatted;
          if(document.getElementById(prefix + '-tp')) document.getElementById(prefix + '-tp').innerText = '$' + tpPrice.toFixed(2);
          if(document.getElementById(prefix + '-sl')) document.getElementById(prefix + '-sl').innerText = '$' + slPrice.toFixed(2);

          let tagElem = document.getElementById(prefix + '-signal-tag');
          if(tagElem) {
            tagElem.innerText = isBuy ? (change > 2.0 ? "STRONG BUY" : "BUY") : (change < -2.0 ? "STRONG SELL" : "SELL");
            tagElem.className = isBuy ? "sig-tag sig-tag-buy" : "sig-tag sig-tag-sell";
          }
        });
      } catch (err) {}
    }

    function initApp() {
      loadTradingViewChart(currentSymbol);
      fetchTop100Coins();
      setInterval(fetchLivePrices, 3000);
    }
  </script>
</body>
</html>
