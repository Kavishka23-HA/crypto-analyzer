<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client Access System</title>
  
  <!-- Supabase JS Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #0d1117;
      color: #00ff66;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .auth-box {
      border: 2px solid #00ff66;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
      background-color: #161b22;
      text-align: center;
      width: 320px;
    }

    .auth-box h3 {
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    input[type="password"], input[type="text"] {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      background-color: #0d1117;
      border: 1px solid #00ff66;
      color: #00ff66;
      border-radius: 5px;
      text-align: center;
      outline: none;
    }

    button {
      width: 98%;
      padding: 10px;
      background-color: #00ff66;
      color: #0d1117;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background-color: #00cc52;
    }

    .error-msg {
      color: #ff3333;
      margin-top: 15px;
      font-size: 13px;
      display: none;
    }

    .success-msg {
      color: #00ff66;
      margin-top: 15px;
      font-size: 13px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- AUTHENTICATION LOCKSCREEN -->
  <div id="security-lockscreen" class="auth-box">
    <h3>&gt;_ ENTER CLIENT ACCESS KEY</h3>
    <input type="password" id="clientPass" placeholder="Paste your key here..." />
    <button onclick="validateKey()">AUTHENTICATE</button>
    <div id="error-msg" class="error-msg">[ERROR] ACCESS DENIED: INVALID KEY</div>
    <div id="success-msg" class="success-msg">[SUCCESS] ACCESS GRANTED! REDIRECTING...</div>
  </div>

  <!-- SUPABASE LOGIC -->
  <script>
    // Supabase Credentials
    const SUPABASE_URL = "https://motvjjunbapbhtryekki.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1vdHZqanVuYmFwYmh0cnlla2tpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4OTUyNzksImV4cCI6MjEwNTQ3MTI3OX0.FAciyAXLrvqp2UBA746vYPAN95gSAM37te0_lgu-vI0";

    // Client Initialization
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Device ID Generator
    function getDeviceId() {
      let devId = localStorage.getItem('user_device_id');
      if (!devId) {
        devId = 'DEV-' + Math.random().toString(36).substring(2, 15) + Date.now().toString(36);
        localStorage.setItem('user_device_id', devId);
      }
      return devId;
    }

    // Key Validation Function
    async function validateKey() {
      const inputKey = document.getElementById("clientPass").value.trim();
      const errorMsg = document.getElementById("error-msg");
      const successMsg = document.getElementById("success-msg");

      errorMsg.style.display = "none";
      successMsg.style.display = "none";

      if (!inputKey) {
        errorMsg.innerText = "[ERROR] PLEASE ENTER A KEY";
        errorMsg.style.display = "block";
        return;
      }

      try {
        // Query to Supabase 'license_keys' table
        const { data, error } = await supabaseClient
          .from('license_keys')
          .select('*')
          .eq('key', inputKey)
          .single();

        if (error || !data) {
          console.error("Supabase Error:", error);
          errorMsg.innerText = "[ERROR] ACCESS DENIED: INVALID KEY";
          errorMsg.style.display = "block";
        } else {
          // Access Granted
          const devId = getDeviceId();
          
          // Device ID එක Database එකේ Update කිරීම
          await supabaseClient
            .from('license_keys')
            .update({ device_id: devId })
            .eq('key', inputKey);

          successMsg.style.display = "block";
          
          // 1.5 Seconds වලින් Dashboard එකට යැවීම හෝ Lockscreen එක hide කිරීම
          setTimeout(() => {
            document.getElementById("security-lockscreen").style.display = "none";
            // ඔයාට Dashboard එකට redirect කරන්න ඕන නම් පහත line එක un-comment කරන්න:
            // window.location.href = "dashboard.html";
          }, 1500);
        }
      } catch (err) {
        console.error("Unexpected Error:", err);
        errorMsg.innerText = "[ERROR] CONNECTION FAILED";
        errorMsg.style.display = "block";
      }
    }
  </script>
</body>
</html>
