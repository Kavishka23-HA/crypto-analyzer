<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="google-site-verification" content="xtttowHOr_ogoG4Qo8ozArR_wI0g7n51zMJ-8qbQbUE" />
  <!-- SEO Meta Tags -->
  <meta name="description" content="Free AI-powered real-time crypto chart and signal analyzer tool for Top 20 Cryptocurrencies.">
  <meta name="keywords" content="crypto analyzer, bitcoin live chart, crypto signals free, tradingview signals, btc eth chart">
  <meta name="robots" content="index, follow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRYPTO-PULSE AI | Multi-Chart & Synchronized AI Signals</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080b10;
      --card-bg: rgba(18, 24, 38, 0.85);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --green-buy: #00e676;
      --red-sell: #ff1744;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

    .ticker-container { width: 100%; background: #0d121d; border-bottom: 1px solid var(--card-border); }

    header { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: rgba(13, 18, 29, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--card-border); }
    .brand-logo { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 22px; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-logo .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #000; font-weight: bold; -webkit-text-fill-color: initial; }

    .free-badge { background: rgba(0, 242, 254, 0.15); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; }

    .dashboard-container { display: grid; grid-template-columns: 2.7fr 1fr; gap: 20px; padding: 20px; max-width: 1750px; margin: 0 auto; width: 100%; flex: 1; }
    .glass-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; backdrop-filter: blur(16px); overflow: hidden; display: flex; flex-direction: column; }

    .chart-section { height: 780px; }
    .signal-section { height: 780px; }

    .section-header { padding: 14px 20px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .section-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

    /* Scrollable Coin Selector Bar */
    .coin-selector-group { display: flex; gap: 8px; overflow-x: auto; max-width: 100%; padding-bottom: 4px; }
    .coin-selector-group::-webkit-scrollbar { height: 4px; }
    .coin-selector-group::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 4px; }
    
    .coin-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--card-border); color: var(--text-muted); padding: 6px 14px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .coin-btn:hover, .coin-btn.active { background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); color: #000; border-color: transparent; }

    .signal-scroll-area { padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; flex: 1; }
    .signal-scroll-area::-webkit-scrollbar { width: 6px; }
    .signal-scroll-area::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    /* Signal Card Style */
    .sig-card { background: rgba(255,255,255,0.03); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; transition: 0.3s; cursor: pointer; }
    .sig-card:hover, .sig-card.active-card { border-color: var(--accent-cyan); background: rgba(0, 242, 254, 0.05); }
    .sig-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .sig-pair { font-weight: 800; font-size: 16px; }
    
    .sig-tag-buy { background: rgba(0, 230, 118, 0.2); color: var(--green-buy); border: 1px solid var(--green-buy); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; }
    .sig-tag-sell { background: rgba(255, 23, 68, 0.2); color: var(--red-sell); border: 1px solid var(--red-sell); padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 800; }
    
    .sig-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center; }
    .sig-val { font-size: 13px; font-weight: 700; margin-top: 4px; }
    .sig-lbl { font-size: 10px; color: var(--text-muted); text-transform: uppercase; }

    @media (max-width: 1024px) { .dashboard-container { grid-template-columns: 1fr; } .chart-section { height: 500px; } }
  </style>
</head>
<body>

  <!-- Top Market Ticker Tape -->
  <div class="ticker-container">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "proName": "BINANCE:BTCUSDT", "title": "Bitcoin" },
          { "proName": "BINANCE:ETHUSDT", "title": "Ethereum" },
          { "proName": "BINANCE:SOLUSDT", "title": "Solana" },
          { "proName": "BINANCE:BNBUSDT", "title": "BNB" },
          { "proName": "BINANCE:XRPUSDT", "title": "XRP" },
          { "proName": "BINANCE:ADAUSDT", "title": "Cardano" },
          { "proName": "BINANCE:DOGEUSDT", "title": "Dogecoin" }
        ],
        "colorTheme": "dark", "isTransparent": true, "displayMode": "adaptive", "locale": "en"
      }
      </script>
    </div>
  </div>

  <header>
    <div class="brand-logo">
      <div class="logo-icon">⚡</div>
      <span>CRYPTO-PULSE AI</span>
    </div>
    <div class="free-badge">🟢 Real-Time Dynamic AI Trader</div>
  </header>

  <div class="dashboard-container">
    
    <!-- Live Switchable Interactive Chart -->
    <div class="glass-card chart-section">
      <div class="section-header">
        <div class="section-title">📈 Interactive Chart: <span id="current-symbol-title" style="color:var(--accent-cyan);">BINANCE:BTCUSDT</span></div>
        <div class="coin-selector-group" id="coin-buttons-container"></div>
      </div>
      <div style="flex: 1; width: 100%; height: 100%; position: relative;">
        <div id="tv_chart_container" style="height:100%; width:100%"></div>
      </div>
    </div>

    <!-- Synchronized Real-Time Signals Feed -->
    <div class="glass-card signal-section">
      <div class="section-header">
        <div class="section-title">🎯 AI Market Signals (Top 20 Coins)</div>
      </div>

      <div class="signal-scroll-area" id="signals-container"></div>
    </div>

  </div>

  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script>
    // List of Top 20 Cryptos
    const coinList = [
      "BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT",
      "ADAUSDT", "DOGEUSDT", "AVAXUSDT", "LINKUSDT", "DOTUSDT",
      "MATICUSDT", "SHIBUSDT", "LTCUSDT", "NEARUSDT", "ATOMUSDT",
      "UNIUSDT", "APTUSDT", "SUIUSDT", "TRXUSDT", "XLMUSDT"
    ];

    let currentSymbol = "BINANCE:BTCUSDT";

    // 1. Generate UI Elements Dynamically
    function buildUI() {
      const btnContainer = document.getElementById('coin-buttons-container');
      const sigContainer = document.getElementById('signals-container');

      btnContainer.innerHTML = '';
      sigContainer.innerHTML = '';

      coinList.forEach((symbol, index) => {
        let coinName = symbol.replace('USDT', '');
        
        // Build Top Selector Buttons
        let btn = document.createElement('button');
        btn.className = `coin-btn ${index === 0 ? 'active' : ''}`;
        btn.innerText = coinName;
        btn.onclick = function() { switchChart(`BINANCE:${symbol}`, this); };
        btnContainer.appendChild(btn);

        // Build Signal Cards
        let card = document.createElement('div');
        card.className = `sig-card ${index === 0 ? 'active-card' : ''}`;
        card.id = `card-${symbol}`;
        card.onclick = function() { switchChart(`BINANCE:${symbol}`); };

        let prefix = coinName.toLowerCase();
        card.innerHTML = `
          <div class="sig-top">
            <span class="sig-pair">${coinName} / USDT <small style="font-size:10px; color:var(--text-muted);">15m</small></span>
            <span class="sig-tag-buy" id="${prefix}-signal-tag">LOADING</span>
          </div>
          <div class="sig-grid">
            <div><div class="sig-lbl">Entry Price</div><div class="sig-val" id="${prefix}-entry">--</div></div>
            <div><div class="sig-lbl">Take Profit</div><div class="sig-val" style="color:var(--green-buy);" id="${prefix}-tp">--</div></div>
            <div><div class="sig-lbl">Stop Loss</div><div class="sig-val" style="color:var(--red-sell);" id="${prefix}-sl">--</div></div>
          </div>
        `;
        sigContainer.appendChild(card);
      });
    }

    // 2. Load TradingView Widget
    function loadTradingViewChart(symbol) {
      document.getElementById("tv_chart_container").innerHTML = "";
      document.getElementById("current-symbol-title").innerText = symbol;
      new TradingView.widget({
        "autosize": true,
        "symbol": symbol,
        "interval": "15",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "toolbar_bg": "#0d121d",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "container_id": "tv_chart_container"
      });
    }

    // 3. Switch Selected Chart & Highlight Active Card
    function switchChart(symbol, btnElement) {
      currentSymbol = symbol;
      loadTradingViewChart(symbol);

      let targetCoin = symbol.replace('BINANCE:', '').replace('USDT', '');

      // Highlight Top Button
      document.querySelectorAll('.coin-btn').forEach(btn => {
        if (btn.innerText === targetCoin) btn.classList.add('active');
        else btn.classList.remove('active');
      });

      // Highlight Signal Card
      let rawPair = symbol.replace('BINANCE:', '');
      document.querySelectorAll('.sig-card').forEach(card => card.classList.remove('active-card'));
      let activeCard = document.getElementById('card-' + rawPair);
      if (activeCard) activeCard.classList.add('active-card');
    }

    // 4. Fetch Live Prices for 20 Coins & Compute Signals
    async function fetchLiveMarketPrices() {
      try {
        const symbolsParam = JSON.stringify(coinList);
        const response = await fetch(`https://api.binance.com/api/v3/ticker/24hr?symbols=${symbolsParam}`);
        const data = await response.json();

        data.forEach(item => {
          let price = parseFloat(item.lastPrice);
          let change = parseFloat(item.priceChangePercent);
          let symbol = item.symbol;

          let isBuy = change >= 0;

          // Formatting price based on value size
          let decimals = price < 1 ? 4 : 2;
          let entryFormatted = '$' + price.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
          let tpPrice = isBuy ? price * 1.025 : price * 0.975;
          let slPrice = isBuy ? price * 0.985 : price * 1.015;

          let tpFormatted = '$' + tpPrice.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
          let slFormatted = '$' + slPrice.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});

          let prefix = symbol.replace('USDT', '').toLowerCase();

          if(document.getElementById(prefix + '-entry')) document.getElementById(prefix + '-entry').innerText = entryFormatted;
          if(document.getElementById(prefix + '-tp')) document.getElementById(prefix + '-tp').innerText = tpFormatted;
          if(document.getElementById(prefix + '-sl')) document.getElementById(prefix + '-sl').innerText = slFormatted;

          let tagElem = document.getElementById(prefix + '-signal-tag');
          if(tagElem) {
            if (isBuy) {
              tagElem.innerText = change > 2.0 ? "STRONG BUY" : "BUY";
              tagElem.className = "sig-tag-buy";
            } else {
              tagElem.innerText = change < -2.0 ? "STRONG SELL" : "SELL";
              tagElem.className = "sig-tag-sell";
            }
          }
        });
      } catch (err) {
        console.error("Live price sync error: ", err);
      }
    }

    // Initialization
    buildUI();
    loadTradingViewChart(currentSymbol);
    fetchLiveMarketPrices();
    setInterval(fetchLiveMarketPrices, 3000);
  </script>

</body>
</html>
